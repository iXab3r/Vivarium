# Separate Portainer stack: keep PostgreSQL available during explicit Host maintenance.
services:
  postgres:
    image: postgres@sha256:0af65001d05296a2ead57ac4a6412433d8913d1bb5d0c88435a7d1e1ee5cb04b
    container_name: vivarium-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "max_connections=40", "-c", "shared_buffers=128MB"]
    volumes:
      - type: bind
        source: /var/lib/vivarium-postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: /etc/vivarium/bootstrap/postgres-admin-password
        target: /run/secrets/postgres-admin-password
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    shm_size: 128m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 6
