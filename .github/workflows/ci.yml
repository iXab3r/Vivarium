name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  # D3 payload portability smokes: the reference payloads must run on machines with no SDKs.
  payload-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish samples/payload-nunit -c Release -r ${{ matrix.rid }} --self-contained -o out/payload
      - name: Run the bare exe and verify TRX
        shell: bash
        run: |
          exe=out/payload/PayloadTests
          if [ "${{ matrix.rid }}" = "win-x64" ]; then exe="$exe.exe"; fi
          "$exe" --report-trx --report-trx-filename results.trx --results-directory out/results
          grep -q 'outcome="Passed"' out/results/results.trx
          if grep -q 'outcome="Failed"' out/results/results.trx; then exit 1; fi

  payload-cross-macos-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish samples/payload-nunit -c Release -r osx-arm64 --self-contained -o out/osx-payload
      - uses: actions/upload-artifact@v4
        with:
          name: osx-payload
          path: out/osx-payload

  payload-cross-macos-run:
    needs: payload-cross-macos-publish
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: osx-payload
          path: payload
      - name: Run a Linux-published macOS binary (cross-publish signing, D3)
        run: |
          chmod +x payload/PayloadTests
          codesign -dv payload/PayloadTests 2>&1 || true
          ./payload/PayloadTests --report-trx --report-trx-filename results.trx --results-directory results
          grep -q 'outcome="Passed"' results/results.trx

  payload-nextest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nextest (prebuilt binary, no cargo install)
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-$HOME/.cargo}/bin
      - name: Archive tests on the build machine
        run: cd samples/payload-rust && cargo nextest archive --archive-file /tmp/payload.tar.zst
      - name: Run the archive on a simulated target (source tree + nextest binary, no build)
        run: |
          mkdir -p /tmp/target-machine
          cp -r samples/payload-rust /tmp/target-machine/payload-rust
          cargo-nextest nextest run --archive-file /tmp/payload.tar.zst --workspace-remap /tmp/target-machine/payload-rust
