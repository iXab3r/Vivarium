// Vivarium agent protocol v1 — see docs/ARCHITECTURE.md §5.
// One bidirectional stream per agent: Hello -> Welcome, then builds down / status+logs+results up.
syntax = "proto3";

package vivarium.v1;

option csharp_namespace = "Vivarium.Contracts.V1";

service AgentHub {
  rpc Session (stream AgentMsg) returns (stream ControllerMsg);
}

message AgentMsg {
  oneof msg {
    Hello hello = 1;
    StepStatus status = 2;
    LogChunk log = 3;
    BuildResult result = 4;
    Heartbeat heartbeat = 5;
    AssignmentAccepted assignment_accepted = 6; // ownership accepted by this exact session (D4/D14)
    UpgradeHealthConfirmed upgrade_health_confirmed = 8; // tag 7 remains reserved for TeamCity service messages (D14)
    UpgradeCommitConfirmed upgrade_commit_confirmed = 9; // durable launcher commit marker written (D30)
    UpgradeFinalizationConfirmed upgrade_finalization_confirmed = 10; // server-recorded marker persisted locally (D30)
  }
}

message ControllerMsg {
  oneof msg {
    Welcome welcome = 1;                  // reply to Hello: server wall-clock (D4), current authorization status
    AuthorizationGranted authorized = 2;  // enrolled flow: auth_token when the operator clicks Authorize (D7)
    BuildAssignment build = 3;
    CancelBuild cancel = 4;
    RestartAgent restart = 5;             // exit; bootstrap fetches the current agent version (D2)
    BuildResultAccepted result_accepted = 6; // durable terminal-result acknowledgement (D4)
    UpgradeHealthAccepted upgrade_health_accepted = 7; // controller reconciled the candidate; persist health before confirming (D30)
    UpgradeCommitAccepted upgrade_commit_accepted = 8; // controller durably entered commit-pending (D30)
    UpgradeCommitRecorded upgrade_commit_recorded = 9; // controller durably recorded the committed marker (D30)
  }
}

message OsInfo {
  string family = 1;   // windows | linux | macos
  string version = 2;  // actual reported version/build — drift detection (D11)
  string arch = 3;     // x64 | arm64
}

// Agent support is independent of policy, caller authorization, runtime eligibility, and the
// outcome of the most recent observation (D22). The stable ID includes the contract major suffix;
// contract_major is repeated as a bounded numeric value so consumers never parse policy from text.
message CapabilitySupport {
  string capability_id = 1;  // e.g. agent-explorer.host-facts.v1
  uint32 contract_major = 2;
}

enum HostFactsOutcome {
  HOST_FACTS_OUTCOME_UNSPECIFIED = 0;
  HOST_FACTS_OUTCOME_SUCCEEDED = 1;
  HOST_FACTS_OUTCOME_PARTIAL = 2;
  HOST_FACTS_OUTCOME_DEGRADED = 3;
  HOST_FACTS_OUTCOME_PERMISSION_DENIED = 4;
  HOST_FACTS_OUTCOME_TEMPORARILY_UNAVAILABLE = 5;
  HOST_FACTS_OUTCOME_FAILED = 6;
}

message HostFactIssue {
  string code = 1;         // stable, non-secret semantic code
  string field = 2;        // affected HostFacts field or values key
  string native_code = 3;  // bounded native error code when available
  string message = 4;      // bounded redacted diagnostic, never a raw exception dump
}

// Safe connect-time facts. Dynamic process, endpoint, environment, and metric inventories use
// explicit bounded refresh operations later; they never ride on Hello or Heartbeat.
message HostFacts {
  string family = 1;                // windows | linux | macos
  string product_name = 2;          // stable product/distribution name
  string product_version = 3;       // user-facing product/distribution version
  string product_build = 4;         // exact Windows build+UBR / macOS build when available
  string kernel_version = 5;        // kernel version kept separate from product version
  string os_architecture = 6;       // x64 | arm64
  string process_architecture = 7;  // x64 | arm64, including translated processes
  string hostname = 8;
  string agent_package_version = 9;
  int64 observed_at_unix_ms = 10;   // agent clock is evidence; controller receipt time is freshness authority
  string collector_version = 11;
  HostFactsOutcome outcome = 12;
  bool complete = 13;
  repeated HostFactIssue issues = 14;
  map<string, string> values = 15;  // bounded safe platform extensions only
}

enum AgentProtocolVersion {
  AGENT_PROTOCOL_VERSION_UNSPECIFIED = 0;
  AGENT_PROTOCOL_VERSION_V1 = 1;
}

message Hello {
  string agent_id = 1;           // persistent GUID (enrolled) / pool-VM identity (managed)
  string auth_token = 2;         // issued at authorization; empty while unauthorized (D7)
  string enroll_token = 3;       // from the setup one-liner / stamped zip; consumed at first contact (§8.4)
  map<string, string> parameters = 4;
  string image_id = 5;           // set for pool VMs
  string session_id = 6;         // nonce per (re)connect — fencing (D4); pool VMs share one OS boot
  string mac = 7;                // identity cross-check (D7)
  string agent_version = 8;      // upgrade handshake (D2)
  OsInfo os = 9;
  bool interactive = 10;         // live desktop present
  string running_build_id = 11;  // non-empty on re-hello: ghost re-adoption (D4)
  string pool_nonce = 12;        // injected at CreatePoolVm (KVP / fw_cfg) — host-verified identity (D7)
  HostFacts host_facts = 13;
  repeated CapabilitySupport capabilities = 14;
  uint32 minimum_protocol_version = 15;
  uint32 current_protocol_version = 16;
  uint64 credential_generation = 17;  // agent belief; controller authentication remains authoritative
  string agent_package_sha256 = 18;   // lowercase SHA-256 of the running package; empty when unavailable
  string upgrade_operation_id = 19;  // launcher-supplied durable operation whose package is running
  string upgrade_failure_code = 20;  // bounded launcher failure/rollback evidence for this operation
}

enum AgentProtocolMode {
  AGENT_PROTOCOL_MODE_UNSPECIFIED = 0;
  AGENT_PROTOCOL_MODE_LEGACY = 1;
  AGENT_PROTOCOL_MODE_NEGOTIATED = 2;
}

message Welcome {
  int64 server_time_unix_ms = 1;
  bool authorized = 2;
  string server_version = 3;
  uint32 selected_protocol_version = 4;
  uint32 minimum_protocol_version = 5;
  uint32 current_protocol_version = 6;
  AgentProtocolMode protocol_mode = 7;
  repeated CapabilitySupport negotiated_capabilities = 8;
  uint64 credential_generation = 9;  // controller-authoritative accepted credential generation
  uint64 connection_generation = 10; // controller-authoritative accepted Session generation
}

message AuthorizationGranted {
  string auth_token = 1;
  uint64 credential_generation = 2;
}

message Blob {
  string sha256 = 1;     // lowercase hex
  string file_name = 2;  // target path relative to the build workdir (forward slashes)
  bool archive = 3;      // zip; extracted under unpack_to
  string unpack_to = 4;  // extraction root relative to workdir; empty = workdir
}

enum StepPolicy {
  STEP_POLICY_DEFAULT = 0;         // run only while no previous step has failed
  STEP_POLICY_EVEN_IF_FAILED = 1;  // run even after failures
  STEP_POLICY_ALWAYS = 2;          // run unconditionally (diagnostics collection)
}

message Step {
  string program = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  string cwd = 4;          // relative to workdir
  int32 timeout_sec = 5;   // 0 = no per-step timeout
  StepPolicy policy = 6;
  bool expected_reboot = 7;  // provisioning: suppress lost-heartbeat INFRA (D6/D9)
}

enum OnFail {
  ON_FAIL_NONE = 0;
  ON_FAIL_KEEP_MACHINE = 1;
  ON_FAIL_SNAPSHOT_MACHINE = 2;
}

message BuildAssignment {
  string build_id = 1;
  repeated Blob payload = 2;
  repeated Step steps = 3;
  repeated string collect = 4;         // artifact globs relative to workdir
  OnFail on_fail = 5;
  map<string, string> parameters = 6;  // resolved scenario params -> env VIVARIUM_PARAM_* (D18)
}

message AssignmentAccepted {
  string build_id = 1;
  string session_id = 2;  // acknowledgement is fenced to the accepting connection (D4)
}

message CancelBuild {
  string build_id = 1;
  string reason = 2;
}

message RestartAgent {
  string reason = 1;
}

message UpgradeHealthAccepted {
  string operation_id = 1;
  string package_sha256 = 2;
  string session_id = 3;
  uint64 connection_generation = 4;
}

message UpgradeHealthConfirmed {
  string operation_id = 1;
  string package_sha256 = 2;
  string session_id = 3;
  uint64 connection_generation = 4;
}

message UpgradeCommitAccepted {
  string operation_id = 1;
  string package_sha256 = 2;
  string session_id = 3;
  uint64 connection_generation = 4;
}

message UpgradeCommitConfirmed {
  string operation_id = 1;
  string package_sha256 = 2;
  string session_id = 3;
  uint64 connection_generation = 4;
}

message UpgradeCommitRecorded {
  string operation_id = 1;
  string package_sha256 = 2;
  string session_id = 3;
  uint64 connection_generation = 4;
}

message UpgradeFinalizationConfirmed {
  string operation_id = 1;
  string package_sha256 = 2;
  string session_id = 3;
  uint64 connection_generation = 4;
}

message StepStatus {
  string build_id = 1;
  int32 step_index = 2;   // -1 for build-level phases
  string phase = 3;       // FETCHING | RUNNING | COLLECTING
}

enum LogStream {
  LOG_STREAM_STDOUT = 0;
  LOG_STREAM_STDERR = 1;
}

message LogChunk {
  string build_id = 1;
  int32 step_index = 2;
  LogStream stream = 3;
  bytes data = 4;
}

message StepResult {
  int32 step_index = 1;
  int32 exit_code = 2;
  bool timed_out = 3;
  bool skipped = 4;
}

message Artifact {
  string path = 1;      // relative to workdir (forward slashes)
  string sha256 = 2;
  int64 size = 3;
}

message BuildResult {
  string build_id = 1;
  string session_id = 2;  // fencing: results from a superseded session are discarded (D4)
  repeated StepResult steps = 3;
  repeated Artifact artifacts = 4;
  BuildOutcome outcome = 5;
  string status_text = 6;
}

message BuildResultAccepted {
  string build_id = 1;
  string session_id = 2;  // the submission attempt being acknowledged
}

enum BuildOutcome {
  BUILD_OUTCOME_UNSPECIFIED = 0;
  BUILD_OUTCOME_SUCCEEDED = 1;
  BUILD_OUTCOME_FAILED = 2;
  BUILD_OUTCOME_CANCELLED = 3;
  BUILD_OUTCOME_INFRASTRUCTURE_FAILED = 4;
}

message Heartbeat {
  string running_build_id = 1;
}
